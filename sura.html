<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" href="images/Quran.png" type="image/svg+xml" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <title>&#1587;&#1608;&#1585;&#1577;</title> -->
    <title>Quran |</title>
    <style>
      body {
        background-color: #1e1f22;
        margin: auto;
        padding: 30px 20px;
        text-align: center;
        font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
        color: #fff;
      }

      @media (max-width: 380px) {
        .audio-heading p {
          font-size: 0.78rem;
        }

        .audio-box {
          padding: 16px 12px;
        }

        .settings-main {
          grid-template-columns: minmax(0, 1fr);
        }

        .mode-btn {
          justify-self: start;
        }

        .player-actions {
          flex-direction: column;
          align-items: stretch;
        }

        .audio-controls {
          align-self: flex-start;
        }

        .audio-message {
          flex: none;
          max-width: 100%;
          text-align: right;
        }

      }

      button {
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        outline: none;
        box-shadow: none;
        padding: 0;
        background: transparent;
      }

      button:focus,
      button:focus-visible,
      button:active {
        outline: none !important;
        box-shadow: none !important;
        border-color: transparent !important;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: rgb(96, 165, 250);
        text-decoration: none;
        font-size: 0.9rem;
        margin-bottom: 20px;
        border: 1px solid rgba(59, 130, 246, 0.2);
        padding: 6px 14px;
        border-radius: 20px;
        background-color: #17255466;
        transition: 0.3s;
      }

      .back-btn:hover {
        background-color: rgba(59, 130, 246, 0.1);
        border-color: rgb(59, 130, 246);
      }

      .box-start {
        margin: auto;
        background-color: #14214966;
        margin-bottom: 30px;
        width: 700px;
        max-width: 100%;
        box-sizing: border-box;
        overflow: hidden;
        padding: 30px;
        position: relative;
        border-radius: 20px;
        border: 0.1px solid rgb(33, 57, 97);
      }

      .sura-name {
        font-size: 2.5rem;
        color: #fff;
        margin: 0;
      }

      .sura-info {
        color: rgb(96, 165, 250);
        font-size: 1rem;
        margin-top: 8px;
      }

      .audio-box {
        margin-top: 18px;
        padding: 18px;
        background: linear-gradient(135deg, #111827, #17255466);
        border: 1px solid rgb(31, 41, 55);
        border-radius: 18px;
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.18);
      }

      .audio-box p {
        margin: 0 0 10px;
        color: rgb(96, 165, 250);
        font-size: 0.95rem;
      }

      .audio-player {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .audio-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        direction: ltr;
      }

      .nav-btn,
      .mode-btn,
      .play-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0 !important;
        border-radius: 50%;
        color: #fff;
        background: linear-gradient(135deg, #2d8cff, #1b6eea);
        cursor: pointer;
        transition: 0.25s;
        box-shadow: none !important;
        outline: none !important;
        -webkit-tap-highlight-color: transparent;
      }

      .nav-btn svg,
      .play-btn svg {
        width: 18px;
        height: 18px;
        display: block;
        fill: currentColor;
      }

      .nav-btn:focus,
      .mode-btn:focus,
      .play-btn:focus,
      .nav-btn:focus-visible,
      .mode-btn:focus-visible,
      .play-btn:focus-visible {
        outline: none !important;
        box-shadow: none !important;
        border: 0 !important;
      }

      .play-btn {
        width: 56px;
        height: 56px;
        flex: 0 0 56px;
        font-size: 1.24rem;
      }

      .nav-btn {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border-radius: 50%;
        font-size: 0.9rem;
      }

      .mode-btn {
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.8rem;
        white-space: nowrap;
      }

      .play-btn:hover,
      .nav-btn:hover,
      .mode-btn:hover {
        transform: scale(1.02);
        box-shadow: none;
      }

      .player-details {
        width: 100%;
      }

      .player-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #dbeafe;
        font-size: 0.85rem;
        margin-bottom: 8px;
      }

      .progress {
        width: 100%;
        height: 7px;
        direction: ltr;
        accent-color: rgb(96, 165, 250);
        cursor: pointer;
      }

      .ayat-container {
        max-width: 850px;
        margin: 24px auto 0;
      }

      .quran-page {
        background-color: #151922;
        border: 1px solid rgb(31, 41, 55);
        border-radius: 14px;
        padding: 30px;
        text-align: justify;
        color: #f3f4f6;
      }

      .bismillah {
        display: block;
        text-align: center;
        color: #ffffff;
        font-size: 1.8rem; /* تم تصغير الحجم */
        line-height: 2;
        margin-bottom: 20px;
        font-family: "Amiri", "Noto Naskh Arabic", serif;
        font-weight: 700;
      }

      .aya-text {
        font-family: "Amiri", "Noto Naskh Arabic", serif;
        font-size: 1.55rem; /* تم تصغير الحجم ليتناسب مع أبعاد الشاشة */
        line-height: 2.3; /* ضبط الارتفاع لتبدو الأسطر متناسقة */
        word-spacing: 3px;
      }

      .aya-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 31px;
        height: 31px;
        margin: 0 7px;
        border-radius: 50%;
        background-color: #17255466;
        border: 1px solid rgba(59, 130, 246, 0.35);
        color: rgb(96, 165, 250);
        font-size: 0.85rem;
        font-family: ui-monospace, monospace;
        vertical-align: middle;
      }

      .loading,
      .error {
        color: rgb(96, 165, 250);
        font-size: 1.2rem;
        margin-top: 50px;
      }

      .error {
        color: #f87171;
      }

      @media (max-width: 600px) {
        body {
          padding: 22px 12px;
        }

        .box-start {
          padding: 24px 16px;
          border-radius: 16px;
        }

        .sura-name {
          font-size: 2rem;
        }

        .quran-page {
          padding: 20px 16px;
        }

        .bismillah {
          font-size: 1.55rem;
        }

        .aya-text {
          font-size: 1.45rem;
          line-height: 2.35;
          word-spacing: 2px;
        }
      }

      body {
        background:
          radial-gradient(ellipse at 50% -15%, rgba(59, 130, 246, 0.12), transparent 42%),
          #1e1f22;
        color: #f3f4f6;
      }

      button {
        font: inherit;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid rgb(96, 165, 250) !important;
        outline-offset: 3px;
      }

      .back-btn {
        color: rgb(96, 165, 250);
        background: #17255466;
        border-color: rgba(59, 130, 246, 0.2);
      }

      .back-btn:hover {
        color: #fff;
        background: rgba(59, 130, 246, 0.1);
        border-color: rgb(59, 130, 246);
      }

      .back-link-row {
        display: flex;
        width: 100%;
        max-width: 760px;
        box-sizing: border-box;
        justify-content: center;
        margin: 0 auto;
        direction: ltr;
        position: relative;
        z-index: 2;
      }

      .back-link-row .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        position: relative;
        top: -6px;
        width: 64px;
        height: 64px;
        box-sizing: border-box;
        padding: 7px;
        background: linear-gradient(145deg, #172554, #111827);
        border: 1px solid rgba(96, 165, 250, 0.38);
        border-radius: 17px;
        box-shadow:
          0 8px 20px rgba(0, 0, 0, 0.24),
          inset 0 1px rgba(255, 255, 255, 0.06);
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .back-link-row .back-btn img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 11px;
      }

      .back-link-row .back-btn::before,
      .back-link-row .back-btn::after {
        position: absolute;
        left: 50%;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease,
          visibility 0.18s ease;
        transform: translate(-50%, -4px);
      }

      .back-link-row .back-btn::before {
        content: "";
        top: calc(100% + 7px);
        width: 10px;
        height: 10px;
        background: #111827;
        border-top: 1px solid rgba(96, 165, 250, 0.32);
        border-left: 1px solid rgba(96, 165, 250, 0.32);
        transform: translate(-50%, -4px) rotate(45deg);
      }

      .back-link-row .back-btn::after {
        content: "العودة إلى الصفحة الرئيسية";
        top: calc(100% + 11px);
        width: max-content;
        max-width: min(230px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 8px 12px;
        color: #dbeafe;
        background: #111827;
        border: 1px solid rgba(96, 165, 250, 0.32);
        border-radius: 10px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
        font-size: 0.78rem;
        font-weight: 600;
        line-height: 1.4;
        direction: rtl;
        white-space: nowrap;
      }

      .back-link-row .back-btn:hover,
      .back-link-row .back-btn:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(96, 165, 250, 0.75);
        box-shadow:
          0 11px 24px rgba(0, 0, 0, 0.3),
          0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .back-link-row .back-btn:hover::before,
      .back-link-row .back-btn:hover::after,
      .back-link-row .back-btn:focus-visible::before,
      .back-link-row .back-btn:focus-visible::after {
        opacity: 1;
        visibility: visible;
      }

      .back-link-row .back-btn:hover::before,
      .back-link-row .back-btn:focus-visible::before {
        transform: translate(-50%, 0) rotate(45deg);
      }

      .back-link-row .back-btn:hover::after,
      .back-link-row .back-btn:focus-visible::after {
        transform: translate(-50%, 0);
      }

      .box-start {
        width: 100%;
        max-width: 760px;
        box-sizing: border-box;
        padding: 34px;
        background: linear-gradient(145deg, #142149, #111827 80%);
        border: 1px solid rgb(33, 57, 97);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.26);
      }

      .sura-name {
        font-family: "Amiri", "Noto Naskh Arabic", serif;
        font-size: clamp(2.4rem, 7vw, 3.5rem);
        line-height: 1.3;
      }

      .sura-info {
        color: rgb(96, 165, 250);
        margin: 8px 0 24px;
      }

      .audio-box {
        margin-top: 0;
        padding: 24px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #111827, #17255466);
        border: 1px solid rgb(31, 41, 55);
        border-radius: 22px;
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.035);
      }

      .player-artwork {
        display: none;
      }

      .audio-box > :not(.player-artwork) {
        position: relative;
        z-index: 1;
      }

      .audio-heading {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        grid-template-areas:
          "gear title"
          "panel panel";
        align-items: center;
        column-gap: 12px;
        row-gap: 6px;
        margin-bottom: 14px;
        direction: rtl;
      }

      .audio-heading .settings-btn {
        grid-area: gear;
      }

      .audio-heading p {
        grid-area: title;
        margin: 0;
        color: #e5e7eb;
        font-size: 1rem;
        font-weight: 600;
        text-align: left;
      }

      .audio-player {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
      }

      .settings-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        color: #bfdbfe;
        background: #111827;
        border: 1px solid rgba(59, 130, 246, 0.24);
        border-radius: 50%;
        cursor: pointer;
        transition:
          color 0.2s ease,
          background-color 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease;
      }

      .settings-btn:hover,
      .settings-btn[aria-expanded="true"] {
        color: #fff;
        background: #172554;
        border-color: rgba(59, 130, 246, 0.65);
      }

      .settings-btn:hover {
        transform: rotate(25deg);
      }

      .settings-btn svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
      }

      .playback-options {
        grid-area: panel;
        justify-self: start;
        align-self: start;
        display: grid;
        box-sizing: border-box;
        width: min(360px, calc(100vw - 104px));
        max-width: 360px;
        gap: 6px;
        margin: 0;
        padding: 8px;
        background: rgba(15, 23, 42, 0.97);
        border: 1px solid rgba(59, 130, 246, 0.32);
        border-radius: 13px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        animation: settings-appear 0.18s ease-out;
      }

      .playback-options[hidden] {
        display: none;
      }

      @keyframes settings-appear {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .settings-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 6px;
      }

      .volume-control {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        color: #bfdbfe;
        font-size: 0.76rem;
      }

      .volume-control svg {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        fill: currentColor;
      }

      .volume-control > span {
        white-space: nowrap;
      }

      .volume-slider {
        width: 100%;
        min-width: 45px;
        height: 5px;
        margin: 0;
        direction: ltr;
        accent-color: rgb(96, 165, 250);
        cursor: pointer;
      }

      .volume-value {
        min-width: 34px;
        color: #dbeafe;
        text-align: left;
        font-variant-numeric: tabular-nums;
      }

      .mode-btn {
        min-height: 36px;
        border-radius: 12px;
        padding: 7px 10px;
        color: #bfdbfe;
        background: #111827;
        font-size: 0.8rem;
        white-space: nowrap;
      }

      .settings-toggles {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .playback-toggle {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 7px;
        min-width: 0;
        min-height: 34px;
        padding: 5px 8px;
        color: #bfdbfe;
        background: #111827;
        border: 1px solid rgba(59, 130, 246, 0.24);
        border-radius: 10px;
        font: inherit;
        font-size: 0.72rem;
        text-align: right;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease;
      }

      .playback-toggle svg {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        fill: currentColor;
      }

      .playback-toggle span {
        min-width: 0;
      }

      .playback-toggle:hover {
        border-color: rgba(59, 130, 246, 0.65);
      }

      .playback-toggle[aria-pressed="true"] {
        color: #fff;
        background: #1e3a8a;
        border-color: rgb(59, 130, 246);
      }

      .player-details {
        order: 0;
      }

      .player-row {
        align-items: center;
        margin-bottom: 10px;
        color: #dbeafe;
        font-size: 0.85rem;
      }

      .player-row span:first-child {
        color: #fff;
        font-weight: 600;
      }

      .progress {
        display: block;
        height: 6px;
        margin: 0;
        accent-color: rgb(96, 165, 250);
      }

      .player-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        direction: ltr;
      }

      .audio-controls {
        gap: 14px;
      }

      .audio-message {
        flex: 0 1 120px;
        max-width: 46%;
        min-height: 1.2em;
        margin: 0;
        color: #93c5fd;
        text-align: right;
        font-size: 0.8rem;
      }

      .nav-btn,
      .mode-btn,
      .play-btn {
        color: #fff;
        background: #172554;
        border: 1px solid rgba(59, 130, 246, 0.28) !important;
        transition:
          transform 0.2s ease,
          background-color 0.2s ease,
          border-color 0.2s ease;
      }

      .nav-btn:hover,
      .mode-btn:hover {
        transform: translateY(-2px);
        background: #1e3a8a;
        border-color: rgba(59, 130, 246, 0.7) !important;
      }

      .play-btn {
        width: 62px;
        height: 62px;
        flex-basis: 62px;
        color: #fff;
        background: linear-gradient(135deg, #2d8cff, #1b6eea);
        border: 0 !important;
        box-shadow: 0 8px 24px rgba(59, 130, 246, 0.22) !important;
      }

      .play-btn:hover {
        transform: scale(1.06);
        background: linear-gradient(135deg, #60a5fa, #2563eb);
      }

      .nav-btn {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
      }

      .nav-btn svg,
      .play-btn svg {
        width: 18px;
        height: 18px;
      }

      .mode-btn {
        border-radius: 12px;
        padding: 10px 14px;
        color: #93c5fd;
        background: transparent;
        font-size: 0.82rem;
      }

      .nav-btn:disabled {
        color: #9ca3af;
        background: #1f2937;
        border-color: rgba(255, 255, 255, 0.06) !important;
        cursor: not-allowed;
        opacity: 0.45;
        transform: none;
      }

      @media (hover: hover) and (pointer: fine) {
        .player-artwork {
          position: absolute;
          inset: 0;
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.2s ease;
          mask-image: radial-gradient(
            circle 170px at var(--pointer-x, 50%) var(--pointer-y, 50%),
            #000 0%,
            transparent 100%
          );
        }

        .audio-box.is-pointer-active .player-artwork {
          opacity: 0.28;
        }
      }

      @media (max-width: 600px) {
        .box-start {
          padding: 26px 16px 18px;
          border-radius: 22px;
        }

        .sura-info {
          margin-bottom: 20px;
        }

        .audio-box {
          padding: 18px 14px;
          border-radius: 18px;
        }

        .audio-heading {
          align-items: center;
          gap: 8px;
          margin-bottom: 12px;
        }

        .audio-heading p {
          font-size: 0.88rem;
        }

        .settings-btn {
          width: 38px;
          height: 38px;
          flex: 0 0 38px;
        }

        .playback-options {
          width: min(360px, calc(100vw - 104px));
          max-width: 360px;
          justify-self: start;
          padding: 8px;
        }

        .settings-main {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 6px;
        }

        .volume-control {
          gap: 5px;
          font-size: 0.72rem;
        }

        .volume-value {
          min-width: 30px;
          font-size: 0.7rem;
        }

        .mode-btn {
          min-height: 34px;
          padding: 6px 8px;
          font-size: 0.7rem;
        }

        .playback-toggle {
          gap: 5px;
          min-height: 32px;
          padding: 4px 6px;
          font-size: 0.66rem;
        }

        .playback-toggle svg {
          width: 14px;
          height: 14px;
          flex-basis: 14px;
        }

        .player-actions {
          align-items: center;
          gap: 10px;
        }

        .audio-message {
          flex-basis: 110px;
          max-width: 43%;
          font-size: 0.7rem;
        }

        .audio-controls {
          gap: 10px;
        }

        .play-btn {
          width: 56px;
          height: 56px;
          flex-basis: 56px;
        }

        .nav-btn {
          width: 38px;
          height: 38px;
          flex-basis: 38px;
        }

        .mode-btn {
          padding: 9px 10px;
          font-size: 0.75rem;
        }

      }

    </style>
    <!-- استدعاء خطوط المصحف من جوجل لتعمل على الماك والويندوز والموبايل -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="back-link-row">
      <a
        href="index.html"
        class="back-btn"
        aria-label="العودة إلى الرئيسية"
        title="العودة إلى الرئيسية"
      >
        <img src="images/Quran.png" alt="" />

    </div>
    <div class="box-start">
      <h1 class="sura-name" id="sura-name">

      <div class="audio-box">
        <img

          aria-hidden="true"
        />
        <div class="audio-heading">
          <button
            class="settings-btn"

            aria-label="إعدادات التلاوة"
            aria-expanded="false"

            title="إعدادات التلاوة"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M19.14 12.94a7.5 7.5 0 0 0 .05-.94 7.5 7.5 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54A.49.49 0 0 0 13.89 2h-3.78a.49.49 0 0 0-.49.42l-.36 2.54a7.3 7.3 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0-.05.94c0 .32.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.21.37.3.61.22l2.39-.96c.5.39 1.05.71 1.63.94l.36 2.54c.04.24.24.42.49.42h3.78c.25 0 .45-.18.49-.42l.36-2.54c.58-.23 1.13-.55 1.63-.94l2.39.96c.24.09.49-.01.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"
              />
            </svg>
          </button>
          <div class="playback-options" id="playback-options" hidden>
            <div class="settings-main">
              <label class="volume-control" for="volume-control">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zm-2.5-9.33v2.06a8 8 0 0 1 0 14.54v2.06a10 10 0 0 0 0-18.66z"
                  />
                </svg>
                <span>الصوت</span>
                <input
                  class="volume-slider"
                  id="volume-control"
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value="1"
                  aria-label="مستوى الصوت"
                />
                <output class="volume-value" id="volume-value" for="volume-control">100%</output>
              </label>
              <button class="mode-btn" id="mode-btn" type="button">
                تلاوة كاملة
              </button>
            </div>
            <div class="settings-toggles">
              <button
                class="playback-toggle"
                id="repeat-toggle"
                type="button"
                aria-label="تكرار التلاوة الحالية"
                aria-pressed="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M17 1l4 4-4 4V6H7a3 3 0 0 0-3 3v1H2V9a5 5 0 0 1 5-5h10V1ZM7 23l-4-4 4-4v3h10a3 3 0 0 0 3-3v-1h2v1a5 5 0 0 1-5 5H7v3ZM2 12h2v2H2zm18 0h2v2h-2z"
                  />
                </svg>
                <span>تكرار</span>
              </button>
              <button
                class="playback-toggle"
                id="auto-next-toggle"
                type="button"
                aria-label="الانتقال تلقائيًا إلى السورة التالية"
                aria-pressed="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 5v14l11-7L4 5Zm12 0v14l6-7-6-7Z" />
                </svg>
                <span>التالي</span>
              </button>
            </div>
          </div>
          <p>
            الشيخ عبد الباسط عبد الصمد
          </p>
        </div>
        <div class="audio-player">
          <div class="player-details">
            <div class="player-row">
              <span id="audio-status"
                >&#1580;&#1575;&#1585;&#1610;
                &#1578;&#1580;&#1607;&#1610;&#1586;
                &#1575;&#1604;&#1578;&#1604;&#1575;&#1608;&#1577;...</span
              >
              <span id="audio-time">0:00 / 0:00</span>
            </div>
            <input
              class="progress"
              id="audio-progress"
              type="range"
              min="0"
              max="100"
              value="0"
            />
          </div>
          <div class="player-actions">
            <div class="audio-controls">
              <button
                class="nav-btn"
                id="prev-btn"
                type="button"
                aria-label="السورة السابقة"
                title="السورة السابقة"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7.5 5.5v13l9-6.5-9-6.5zm10.5 0h-2.2v13H18V5.5z" />
                </svg>
              </button>
              <button
                class="play-btn"
                id="play-btn"
                type="button"
                aria-label="تشغيل"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5.5v13l10-6.5L8 5.5z" />
                </svg>
              </button>
              <button
                class="nav-btn"
                id="next-btn"
                type="button"
                aria-label="السورة التالية"
                title="السورة التالية"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M16.5 18.5v-13l-9 6.5 9 6.5zm-10.5 0h2.2v-13H6v13z" />
                </svg>
              </button>
            </div>
            <div class="audio-message" id="audio-message"></div>
          </div>
          <audio
            id="quran-audio"
            preload="metadata"
            crossorigin="anonymous"
          ></audio>

      </div>

    <div class="ayat-container" id="ayat-container">
      <p class="loading">
        &#1580;&#1575;&#1585;&#1610; &#1578;&#1581;&#1605;&#1610;&#1604;
        &#1575;&#1604;&#1587;&#1608;&#1585;&#1577;...
      </p>
    </div>

    <script>
      const searchParams = new URLSearchParams(window.location.search);
      const id = searchParams.get("id") || "1";
      const startInFullSurahMode = searchParams.get("mode") === "full";
      const autoplayOnLoad = searchParams.get("autoplay") === "1";
      const bismillah =
        "\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u0651\u064e\u0647\u0650 \u0627\u0644\u0631\u0651\u064e\u062d\u0652\u0645\u064e\u0670\u0646\u0650 \u0627\u0644\u0631\u0651\u064e\u062d\u0650\u064a\u0645\u0650";
      const audio = document.getElementById("quran-audio");
      const playBtn = document.getElementById("play-btn");
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      const modeBtn = document.getElementById("mode-btn");
      const audioStatus = document.getElementById("audio-status");
      const audioTime = document.getElementById("audio-time");
      const audioProgress = document.getElementById("audio-progress");
      const audioMessage = document.getElementById("audio-message");
      const volumeControl = document.getElementById("volume-control");
      const volumeValue = document.getElementById("volume-value");
      const settingsToggle = document.getElementById("settings-toggle");
      const playbackOptions = document.getElementById("playback-options");
      const audioBox = document.querySelector(".audio-box");
      const repeatToggle = document.getElementById("repeat-toggle");
      const autoNextToggle = document.getElementById("auto-next-toggle");

      let currentSurah = null;
      let currentAyaIndex = 0;
      let isDragging = false;
      let fullSurahMode = startInFullSurahMode;
      let repeatCurrent = localStorage.getItem("quran-player-repeat") === "true";
      let autoNextSurah = localStorage.getItem("quran-player-auto-next") === "true";

      if (repeatCurrent && autoNextSurah) {
        autoNextSurah = false;
        localStorage.setItem("quran-player-auto-next", "false");
      }

      function updateVolumeValue() {
        volumeValue.textContent = `${Math.round(audio.volume * 100)}%`;
      }

      function updatePlaybackToggles() {
        repeatToggle.setAttribute("aria-pressed", String(repeatCurrent));
        repeatToggle.setAttribute(
          "aria-label",
          `تكرار ${fullSurahMode ? "السورة" : "التلاوة الحالية"}`,
        );
        repeatToggle.title = repeatToggle.getAttribute("aria-label");
        autoNextToggle.setAttribute("aria-pressed", String(autoNextSurah));
      }

      function updateMediaSessionMetadata() {
        if (
          !("mediaSession" in navigator) ||
          typeof MediaMetadata === "undefined" ||
          !currentSurah
        ) {
          return;
        }

        const title = fullSurahMode
          ? currentSurah.name
          : `${currentSurah.name} - الآية ${currentAyaIndex + 1}`;
        const artwork =
          window.location.protocol === "file:"
            ? []
            : [
                {
                  src: new URL("images/unnamed.webp", document.baseURI).href,
                  sizes: "240x240",
                  type: "image/webp",
                },
              ];
        navigator.mediaSession.metadata = new MediaMetadata({
          title,
          artist: "الشيخ عبد الباسط عبد الصمد",
          album: "القرآن الكريم",
          artwork,
        });
      }

      function setupMediaSession() {
        if (!("mediaSession" in navigator)) return;

        const mediaSession = navigator.mediaSession;
        mediaSession.setActionHandler("play", playCurrentSelection);
        mediaSession.setActionHandler("pause", () => audio.pause());

        const supportedActions = mediaSession.getSupportedActions?.() ?? [];
        if (supportedActions.includes("previoustrack")) {
          mediaSession.setActionHandler("previoustrack", () => prevBtn.click());
        }
        if (supportedActions.includes("nexttrack")) {
          mediaSession.setActionHandler("nexttrack", () => nextBtn.click());
        }
        if (supportedActions.includes("seekbackward")) {
          mediaSession.setActionHandler("seekbackward", ({ seekOffset = 10 }) => {
            if (Number.isFinite(audio.currentTime)) {
              audio.currentTime = Math.max(0, audio.currentTime - seekOffset);
            }
          });
        }
        if (supportedActions.includes("seekforward")) {
          mediaSession.setActionHandler("seekforward", ({ seekOffset = 10 }) => {
            if (!Number.isFinite(audio.duration)) return;
            audio.currentTime = Math.min(
              audio.duration,
              audio.currentTime + seekOffset,
            );
          });
        }
        if (supportedActions.includes("seekto")) {
          mediaSession.setActionHandler("seekto", ({ seekTime }) => {
            if (Number.isFinite(seekTime) && Number.isFinite(audio.duration)) {
              audio.currentTime = Math.min(audio.duration, seekTime);
            }
          });
        }
      }

      const savedVolumeValue = localStorage.getItem("quran-player-volume");
      const savedVolume =
        savedVolumeValue === null ? Number.NaN : Number(savedVolumeValue);
      audio.volume =
        Number.isFinite(savedVolume) && savedVolume >= 0 && savedVolume <= 1
          ? savedVolume
          : 1;
      volumeControl.value = String(audio.volume);
      updateVolumeValue();
      updatePlaybackToggles();
      setupMediaSession();

      settingsToggle.addEventListener("click", () => {
        const isExpanded = settingsToggle.getAttribute("aria-expanded") === "true";
        settingsToggle.setAttribute("aria-expanded", String(!isExpanded));
        playbackOptions.hidden = isExpanded;
      });

      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        audioBox.addEventListener("pointermove", (event) => {
          const bounds = audioBox.getBoundingClientRect();
          audioBox.style.setProperty(
            "--pointer-x",
            `${event.clientX - bounds.left}px`,
          );
          audioBox.style.setProperty(
            "--pointer-y",
            `${event.clientY - bounds.top}px`,
          );
          audioBox.classList.add("is-pointer-active");
        });

        audioBox.addEventListener("pointerleave", () => {
          audioBox.classList.remove("is-pointer-active");
        });
      }

      document.addEventListener("pointerdown", (event) => {
        if (
          !settingsToggle.contains(event.target) &&
          !playbackOptions.contains(event.target)
        ) {
          settingsToggle.setAttribute("aria-expanded", "false");
          playbackOptions.hidden = true;
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !playbackOptions.hidden) {
          settingsToggle.setAttribute("aria-expanded", "false");
          playbackOptions.hidden = true;
          settingsToggle.focus();
        }
      });

      volumeControl.addEventListener("input", () => {
        audio.volume = Number(volumeControl.value);
        localStorage.setItem("quran-player-volume", String(audio.volume));
        updateVolumeValue();
      });

      repeatToggle.addEventListener("click", () => {
        repeatCurrent = !repeatCurrent;
        if (repeatCurrent) {
          autoNextSurah = false;
          localStorage.setItem("quran-player-auto-next", "false");
        }
        localStorage.setItem("quran-player-repeat", String(repeatCurrent));
        updatePlaybackToggles();
      });

      autoNextToggle.addEventListener("click", () => {
        autoNextSurah = !autoNextSurah;
        if (autoNextSurah) {
          repeatCurrent = false;
          localStorage.setItem("quran-player-repeat", "false");
        }
        localStorage.setItem("quran-player-auto-next", String(autoNextSurah));
        updatePlaybackToggles();
      });

      function fetchSurahData(url) {
        return fetch(url).then((response) => {
          if (!response.ok) {
            throw new Error(`Surah API returned HTTP ${response.status}`);
          }
          return response.json();
        }).then((payload) => {
          if (!payload.data || !Array.isArray(payload.data.ayahs)) {
            throw new Error("Surah API response did not contain ayahs");
          }
          return payload.data;
        });
      }

      function displaySurah(surah) {
        currentSurah = surah;
        document.title = `Quran | ${currentSurah.name}`;
        document.getElementById("sura-name").textContent = currentSurah.name;
        document.getElementById("sura-info").textContent =
          "عدد الآيات: " +
          currentSurah.numberOfAyahs +
          " | " +
          (currentSurah.revelationType === "Meccan" ? "مكية" : "مدنية");
        updateSurahNavigation();
        updateMediaSessionMetadata();
        initAudio();
        renderAyahs();
      }

      fetchSurahData(
        `https://api.alquran.cloud/v1/surah/${id}/ar.abdulbasit_mujawwad`,
      )
        .catch((primaryError) => {
          console.error("Primary surah API request failed:", primaryError);
          return fetchSurahData(`https://api.alquran.cloud/v1/surah/${id}`);
        })
        .then(displaySurah)
        .catch((error) => {
          console.error("Unable to load surah data:", error);
          document.getElementById("sura-name").textContent = "تعذر تحميل السورة";
          document.getElementById("sura-info").textContent =
            "تحقق من اتصال الإنترنت ثم أعد المحاولة.";
          audioStatus.textContent = "غير متصل";
          audioMessage.textContent = "تعذر تحميل بيانات السورة";
          document.querySelector(".loading").textContent =
            "تعذر تحميل السورة. تحقق من اتصال الإنترنت ثم أعد المحاولة.";
        });

      function updateSurahNavigation() {
        updatePlaybackNavigation();
      }

      function updatePlaybackNavigation() {
        if (!currentSurah) return;

        const previousLabel = fullSurahMode
          ? "السورة السابقة"
          : "الآية السابقة";
        const nextLabel = fullSurahMode ? "السورة التالية" : "الآية التالية";

        prevBtn.disabled = fullSurahMode
          ? currentSurah.number <= 1
          : currentAyaIndex <= 0;
        nextBtn.disabled = fullSurahMode
          ? currentSurah.number >= 114
          : currentAyaIndex >= currentSurah.ayahs.length - 1;
        prevBtn.setAttribute("aria-label", previousLabel);
        prevBtn.title = previousLabel;
        nextBtn.setAttribute("aria-label", nextLabel);
        nextBtn.title = nextLabel;
      }

      function navigateToSurah(direction, autoplay) {
        const params = new URLSearchParams({
          id: String(currentSurah.number + direction),
        });
        if (fullSurahMode) params.set("mode", "full");
        if (autoplay) params.set("autoplay", "1");
        window.location.href = `sura.html?${params}`;
      }

      function getAudioUrl(ayahIndex) {
        if (!currentSurah || !currentSurah.ayahs[ayahIndex]) return "";

        const ayah = currentSurah.ayahs[ayahIndex];
        const surahNumber = String(currentSurah.number).padStart(3, "0");
        const ayahNumber = String(ayah.numberInSurah).padStart(3, "0");

        return `https://everyayah.com/data/Abdul_Basit_Mujawwad_128kbps/${surahNumber}${ayahNumber}.mp3`;
      }

      function getFullSurahAudioUrl() {
        if (!currentSurah) return "";
        const surahNumber = String(currentSurah.number).padStart(3, "0");
        return `https://download.quranicaudio.com/quran/abdul_basit_murattal/${surahNumber}.mp3`;
      }

      function initAudio() {
        if (!currentSurah) return;
        currentAyaIndex = 0;
        audioStatus.textContent = "جاهز ✓";
        audioProgress.value = 0;
        audioTime.textContent = "0:00 / 0:00";
        audioMessage.textContent = "";
        updateModeButton();
        if (fullSurahMode) {
          loadFullSurah(autoplayOnLoad);
        } else {
          loadAudioAyah(0, autoplayOnLoad);
        }
      }

      function updateModeButton() {
        modeBtn.textContent = fullSurahMode ? "الآية الحالية" : "تلاوة كاملة";
        updatePlaybackNavigation();
        updatePlaybackToggles();
      }

      function loadAudioAyah(index, autoplay = false) {
        if (!currentSurah || index < 0 || index >= currentSurah.ayahs.length)
          return;

        currentAyaIndex = index;
        updatePlaybackNavigation();
        updateMediaSessionMetadata();
        const aya = currentSurah.ayahs[index];
        const src = getAudioUrl(index);

        audio.src = src;
        audio.load();
        audioStatus.textContent = `الآية ${aya.numberInSurah} من ${currentSurah.numberOfAyahs}`;
        audioProgress.value = 0;
        audioMessage.textContent = "جاري التحميل...";

        if (autoplay) {
          const startPlayback = () => {
            audio.play().catch((err) => {
              console.error(err);
              audioMessage.textContent = "تعذر التشغيل، جرّب مرة أخرى";
            });
          };

          if (audio.readyState >= 1) {
            startPlayback();
          } else {
            audio.addEventListener("loadeddata", startPlayback, { once: true });
          }
        }
      }

      function loadFullSurah(autoplay = false) {
        if (!currentSurah) return;

        const src = getFullSurahAudioUrl();
        if (!src) return;

        updateMediaSessionMetadata();
        audio.src = src;
        audio.load();
        audioStatus.textContent = `السورة كاملة: ${currentSurah.name}`;
        audioProgress.value = 0;
        audioMessage.textContent = "جاري تحميل التلاوة الكاملة...";

        if (autoplay) {
          const startPlayback = () => {
            audio.play().catch((err) => {
              console.error(err);
              audioMessage.textContent = "تعذر تشغيل التلاوة الكاملة";
            });
          };

          if (audio.readyState >= 1) {
            startPlayback();
          } else {
            audio.addEventListener("loadeddata", startPlayback, { once: true });
          }
        }
      }

      function playCurrentSelection() {
        if (!currentSurah) return;

        const src = fullSurahMode
          ? getFullSurahAudioUrl()
          : getAudioUrl(currentAyaIndex);
        if (src && audio.src === new URL(src, document.baseURI).href) {
          audio.play().catch((err) => {
            console.error(err);
            audioMessage.textContent = "تعذر التشغيل، جرّب مرة أخرى";
          });
          return;
        }

        if (fullSurahMode) {
          loadFullSurah(true);
          return;
        }

        loadAudioAyah(currentAyaIndex, true);
      }

      function updatePlayButton(isPlaying) {
        const icon = isPlaying
          ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z" />'
          : '<path d="M8 5.5v13l10-6.5L8 5.5z" />';
        playBtn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>`;
        playBtn.setAttribute("aria-label", isPlaying ? "إيقاف مؤقت" : "تشغيل");
      }

      playBtn.addEventListener("click", () => {
        if (audio.paused) {
          playCurrentSelection();
        } else {
          audio.pause();
        }
      });

      prevBtn.addEventListener("click", () => {
        if (fullSurahMode && currentSurah && currentSurah.number > 1) {
          navigateToSurah(-1, true);
        } else if (!fullSurahMode && currentAyaIndex > 0) {
          loadAudioAyah(currentAyaIndex - 1, true);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (fullSurahMode && currentSurah && currentSurah.number < 114) {
          navigateToSurah(1, true);
        } else if (
          !fullSurahMode &&
          currentSurah &&
          currentAyaIndex < currentSurah.ayahs.length - 1
        ) {
          loadAudioAyah(currentAyaIndex + 1, true);
        }
      });

      modeBtn.addEventListener("click", () => {
        if (!currentSurah) return;

        fullSurahMode = !fullSurahMode;
        updateModeButton();

        if (fullSurahMode) {
          loadFullSurah(true);
        } else {
          loadAudioAyah(currentAyaIndex, true);
        }
      });

      audio.addEventListener("play", () => {
        updatePlayButton(true);
        if ("mediaSession" in navigator) {
          navigator.mediaSession.playbackState = "playing";
        }
      });

      audio.addEventListener("pause", () => {
        updatePlayButton(false);
        if ("mediaSession" in navigator) {
          navigator.mediaSession.playbackState = "paused";
        }
      });

      audio.addEventListener("timeupdate", () => {
        if (
          !isDragging &&
          Number.isFinite(audio.duration) &&
          audio.duration > 0
        ) {
          audioProgress.value = (audio.currentTime / audio.duration) * 100 || 0;
        }
        audioTime.textContent =
          formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
        if (
          "mediaSession" in navigator &&
          typeof navigator.mediaSession.setPositionState === "function" &&
          Number.isFinite(audio.duration) &&
          audio.duration > 0
        ) {
          navigator.mediaSession.setPositionState({
            duration: audio.duration,
            playbackRate: audio.playbackRate,
            position: audio.currentTime,
          });
        }
      });

      audio.addEventListener("canplay", () => {
        audioMessage.textContent = "✓ جاهز";
      });

      audio.addEventListener("ended", () => {
        if ("mediaSession" in navigator) {
          navigator.mediaSession.playbackState = "paused";
        }
        if (!currentSurah) return;

        if (repeatCurrent) {
          if (fullSurahMode) {
            loadFullSurah(true);
          } else {
            loadAudioAyah(currentAyaIndex, true);
          }
          return;
        }

        if (!fullSurahMode) {
          if (currentAyaIndex < currentSurah.ayahs.length - 1) {
            loadAudioAyah(currentAyaIndex + 1, true);
            return;
          }

          if (autoNextSurah && currentSurah.number < 114) {
            navigateToSurah(1, true);
            return;
          }

          audioStatus.textContent = "انتهت التلاوة ✓";
          updatePlayButton(false);
          return;
        }

        if (autoNextSurah && currentSurah.number < 114) {
          navigateToSurah(1, true);
          return;
        }

        audioStatus.textContent = "انتهت التلاوة ✓";
        updatePlayButton(false);
      });

      audio.addEventListener("error", () => {
        if (fullSurahMode) {
          audioMessage.textContent =
            "تعذر تشغيل التلاوة الكاملة، تم الإرجاع إلى الآية الحالية";
          fullSurahMode = false;
          updateModeButton();
          loadAudioAyah(currentAyaIndex, true);
          return;
        }

        audioMessage.textContent = "تعذر تحميل هذه الآية، جرّب الآية التالية";
        console.error("Audio file not found:", audio.src);
      });

      audioProgress.addEventListener("mousedown", () => {
        isDragging = true;
      });

      audioProgress.addEventListener("change", () => {
        if (audio.duration) {
          audio.currentTime = (audioProgress.value / 100) * audio.duration;
        }
        isDragging = false;
      });

      function formatTime(seconds) {
        if (!Number.isFinite(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");
        return mins + ":" + secs;
      }

      function renderAyahs() {
        const container = document.getElementById("ayat-container");
        const page = document.createElement("div");
        page.className = "quran-page";

        const text = document.createElement("div");
        text.className = "aya-text";

        if (currentSurah.number !== 1 && currentSurah.number !== 9) {
          const basmala = document.createElement("span");
          basmala.className = "bismillah";
          basmala.textContent = bismillah;
          page.appendChild(basmala);
        }

        currentSurah.ayahs.forEach((aya) => {
          const ayaText = document.createTextNode(
            removeBismillah(aya.text, currentSurah.number, aya.numberInSurah),
          );
          const ayaNumber = document.createElement("span");
          ayaNumber.className = "aya-number";
          ayaNumber.textContent = aya.numberInSurah;

          text.appendChild(ayaText);
          text.appendChild(ayaNumber);
        });

        page.appendChild(text);
        container.innerHTML = "";
        container.appendChild(page);
      }

      function removeBismillah(text, suraNumber, ayaNumber) {
        if (suraNumber === 1 || suraNumber === 9 || ayaNumber !== 1) {
          return text;
        }
        const words = text.trim().split(/\s+/);
        return words.length > 4 ? words.slice(4).join(" ") : text;
      }
    </script>
    <script>
      if (
        "serviceWorker" in navigator &&
        window.isSecureContext
      ) {
        navigator.serviceWorker
          .register("./service-worker.js", { updateViaCache: "none" })
          .catch((error) =>
            console.error("Service worker registration failed:", error),
          );
      }
    </script>
  </body>
