<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" href="images/unnamed (1).webp" type="image/x-icon" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <title>&#1587;&#1608;&#1585;&#1577;</title> -->
    <title>Quran |</title>
    <style>
      body {
        background-color: #1e1f22;
        margin: auto;
        padding: 30px 20px;
        text-align: center;
        font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
        color: #fff;
      }

      button {
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        outline: none;
        box-shadow: none;
        padding: 0;
        background: transparent;
      }

      button:focus,
      button:focus-visible,
      button:active {
        outline: none !important;
        box-shadow: none !important;
        border-color: transparent !important;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: rgb(96, 165, 250);
        text-decoration: none;
        font-size: 0.9rem;
        margin-bottom: 20px;
        border: 1px solid rgba(59, 130, 246, 0.2);
        padding: 6px 14px;
        border-radius: 20px;
        background-color: #17255466;
        transition: 0.3s;
      }

      .back-btn:hover {
        background-color: rgba(59, 130, 246, 0.1);
        border-color: rgb(59, 130, 246);
      }

      .box-start {
        margin: auto;
        background-color: #14214966;
        margin-bottom: 30px;
        width: 700px;
        max-width: 100%;
        box-sizing: border-box;
        overflow: hidden;
        padding: 30px;
        position: relative;
        border-radius: 20px;
        border: 0.1px solid rgb(33, 57, 97);
      }

      .sura-name {
        font-size: 2.5rem;
        color: #fff;
        margin: 0;
      }

      .sura-info {
        color: rgb(96, 165, 250);
        font-size: 1rem;
        margin-top: 8px;
      }

      .audio-box {
        margin-top: 18px;
        padding: 18px;
        background: linear-gradient(135deg, #111827, #17255466);
        border: 1px solid rgb(31, 41, 55);
        border-radius: 18px;
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.18);
      }

      .audio-box p {
        margin: 0 0 10px;
        color: rgb(96, 165, 250);
        font-size: 0.95rem;
      }

      .audio-player {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .audio-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        direction: ltr;
      }

      .nav-btn,
      .mode-btn,
      .play-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0 !important;
        border-radius: 50%;
        color: #fff;
        background: linear-gradient(135deg, #2d8cff, #1b6eea);
        cursor: pointer;
        transition: 0.25s;
        box-shadow: none !important;
        outline: none !important;
        -webkit-tap-highlight-color: transparent;
      }

      .nav-btn svg,
      .play-btn svg {
        width: 18px;
        height: 18px;
        display: block;
        fill: currentColor;
      }

      .nav-btn:focus,
      .mode-btn:focus,
      .play-btn:focus,
      .nav-btn:focus-visible,
      .mode-btn:focus-visible,
      .play-btn:focus-visible {
        outline: none !important;
        box-shadow: none !important;
        border: 0 !important;
      }

      .play-btn {
        width: 56px;
        height: 56px;
        flex: 0 0 56px;
        font-size: 1.24rem;
      }

      .nav-btn {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border-radius: 50%;
        font-size: 0.9rem;
      }

      .mode-btn {
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.8rem;
        white-space: nowrap;
      }

      .play-btn:hover,
      .nav-btn:hover,
      .mode-btn:hover {
        transform: scale(1.02);
        box-shadow: none;
      }

      .player-details {
        width: 100%;
      }

      .player-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #dbeafe;
        font-size: 0.85rem;
        margin-bottom: 8px;
      }

      .progress {
        width: 100%;
        height: 7px;
        direction: ltr;
        accent-color: rgb(96, 165, 250);
        cursor: pointer;
      }

      .audio-message {
        margin-top: 8px;
        color: #93c5fd;
        font-size: 0.8rem;
      }

      .ayat-container {
        max-width: 850px;
        margin: auto;
      }

      .quran-page {
        background-color: #151922;
        border: 1px solid rgb(31, 41, 55);
        border-radius: 14px;
        padding: 30px;
        text-align: justify;
        color: #f3f4f6;
      }

      .bismillah {
        display: block;
        text-align: center;
        color: #ffffff;
        font-size: 1.8rem; /* تم تصغير الحجم */
        line-height: 2;
        margin-bottom: 20px;
        font-family: "Amiri", "Noto Naskh Arabic", serif;
        font-weight: 700;
      }

      .aya-text {
        font-family: "Amiri", "Noto Naskh Arabic", serif;
        font-size: 1.55rem; /* تم تصغير الحجم ليتناسب مع أبعاد الشاشة */
        line-height: 2.3; /* ضبط الارتفاع لتبدو الأسطر متناسقة */
        word-spacing: 3px;
      }

      .aya-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 31px;
        height: 31px;
        margin: 0 7px;
        border-radius: 50%;
        background-color: #17255466;
        border: 1px solid rgba(59, 130, 246, 0.35);
        color: rgb(96, 165, 250);
        font-size: 0.85rem;
        font-family: ui-monospace, monospace;
        vertical-align: middle;
      }

      .loading,
      .error {
        color: rgb(96, 165, 250);
        font-size: 1.2rem;
        margin-top: 50px;
      }

      .error {
        color: #f87171;
      }

      @media (max-width: 600px) {
        body {
          padding: 22px 12px;
        }

        .box-start {
          padding: 24px 16px;
          border-radius: 16px;
        }

        .sura-name {
          font-size: 2rem;
        }

        .quran-page {
          padding: 20px 16px;
        }

        .bismillah {
          font-size: 1.55rem;
        }

        .aya-text {
          font-size: 1.45rem;
          line-height: 2.35;
          word-spacing: 2px;
        }
      }
    </style>
    <!-- استدعاء خطوط المصحف من جوجل لتعمل على الماك والويندوز والموبايل -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <a href="index.html" class="back-btn"
      >&#8592; &#1575;&#1604;&#1593;&#1608;&#1583;&#1577;
      &#1604;&#1604;&#1585;&#1574;&#1610;&#1587;&#1610;&#1577;</a
    >

    <div class="box-start">
      <h1 class="sura-name" id="sura-name">
        &#1580;&#1575;&#1585;&#1610;
        &#1575;&#1604;&#1578;&#1581;&#1605;&#1610;&#1604;...
      </h1>
      <p class="sura-info" id="sura-info"></p>
      <div class="audio-box">
        <p>
          &#1578;&#1604;&#1575;&#1608;&#1577;
          &#1575;&#1604;&#1588;&#1610;&#1582; &#1593;&#1576;&#1583;
          &#1575;&#1604;&#1576;&#1575;&#1587;&#1591; &#1593;&#1576;&#1583;
          &#1575;&#1604;&#1589;&#1605;&#1583;
        </p>
        <div class="audio-player">
          <div class="audio-controls">
            <button
              class="nav-btn"
              id="prev-btn"
              type="button"
              aria-label="السابق"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7.5 5.5v13l9-6.5-9-6.5zm10.5 0h-2.2v13H18V5.5z" />
              </svg>
            </button>
            <button
              class="play-btn"
              id="play-btn"
              type="button"
              aria-label="تشغيل"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5.5v13l10-6.5L8 5.5z" />
              </svg>
            </button>
            <button
              class="nav-btn"
              id="next-btn"
              type="button"
              aria-label="التالي"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16.5 18.5v-13l-9 6.5 9 6.5zm-10.5 0h2.2v-13H6v13z" />
              </svg>
            </button>
          </div>
          <div class="player-details">
            <div class="player-row">
              <span id="audio-status"
                >&#1580;&#1575;&#1585;&#1610;
                &#1578;&#1580;&#1607;&#1610;&#1586;
                &#1575;&#1604;&#1578;&#1604;&#1575;&#1608;&#1577;...</span
              >
              <span id="audio-time">0:00 / 0:00</span>
            </div>
            <input
              class="progress"
              id="audio-progress"
              type="range"
              min="0"
              max="100"
              value="0"
            />
          </div>
          <button class="mode-btn" id="mode-btn" type="button">
            تلاوة كاملة
          </button>
        </div>
        <div class="audio-message" id="audio-message"></div>
        <audio
          id="quran-audio"
          preload="metadata"
          crossorigin="anonymous"
        ></audio>
      </div>
    </div>

    <div class="ayat-container" id="ayat-container">
      <p class="loading">
        &#1580;&#1575;&#1585;&#1610; &#1578;&#1581;&#1605;&#1610;&#1604;
        &#1575;&#1604;&#1587;&#1608;&#1585;&#1577;...
      </p>
    </div>

    <script>
      const id = new URLSearchParams(window.location.search).get("id") || "1";
      const bismillah =
        "\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u0651\u064e\u0647\u0650 \u0627\u0644\u0631\u0651\u064e\u062d\u0652\u0645\u064e\u0670\u0646\u0650 \u0627\u0644\u0631\u0651\u064e\u062d\u0650\u064a\u0645\u0650";
      const audio = document.getElementById("quran-audio");
      const playBtn = document.getElementById("play-btn");
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      const modeBtn = document.getElementById("mode-btn");
      const audioStatus = document.getElementById("audio-status");
      const audioTime = document.getElementById("audio-time");
      const audioProgress = document.getElementById("audio-progress");
      const audioMessage = document.getElementById("audio-message");

      let currentSurah = null;
      let currentAyaIndex = 0;
      let isDragging = false;
      let fullSurahMode = false;

      fetch(`https://api.alquran.cloud/v1/surah/${id}/ar.abdulbasit_mujawwad`)
        .then((r) => r.json())
        .then((data) => {
          currentSurah = data.data;
          document.title = `Quran | ${currentSurah.name}`;
          document.getElementById("sura-name").textContent = currentSurah.name;
          document.getElementById("sura-info").textContent =
            "عدد الآيات: " +
            currentSurah.numberOfAyahs +
            " | " +
            (currentSurah.revelationType === "Meccan" ? "مكية" : "مدنية");
          initAudio();
          renderAyahs();
        })
        .catch((err) => {
          console.error(err);
          fetch(`https://api.alquran.cloud/v1/surah/${id}`)
            .then((r) => r.json())
            .then((d) => {
              currentSurah = d.data;
              initAudio();
              renderAyahs();
            });
        });

      function getAudioUrl(ayahIndex) {
        if (!currentSurah || !currentSurah.ayahs[ayahIndex]) return "";

        const ayah = currentSurah.ayahs[ayahIndex];
        const surahNumber = String(currentSurah.number).padStart(3, "0");
        const ayahNumber = String(ayah.numberInSurah).padStart(3, "0");

        return `https://everyayah.com/data/Abdul_Basit_Mujawwad_128kbps/${surahNumber}${ayahNumber}.mp3`;
      }

      function getFullSurahAudioUrl() {
        if (!currentSurah) return "";
        const surahNumber = String(currentSurah.number).padStart(3, "0");
        return `https://download.quranicaudio.com/quran/abdul_basit_murattal/${surahNumber}.mp3`;
      }

      function initAudio() {
        if (!currentSurah) return;
        currentAyaIndex = 0;
        audioStatus.textContent = "جاهز ✓";
        audioProgress.value = 0;
        audioTime.textContent = "0:00 / 0:00";
        audioMessage.textContent = "";
        updateModeButton();
        loadAudioAyah(0, false);
      }

      function updateModeButton() {
        modeBtn.textContent = fullSurahMode ? "الآية الحالية" : "تلاوة كاملة";
      }

      function loadAudioAyah(index, autoplay = false) {
        if (!currentSurah || index < 0 || index >= currentSurah.ayahs.length)
          return;

        currentAyaIndex = index;
        const aya = currentSurah.ayahs[index];
        const src = getAudioUrl(index);

        audio.src = src;
        audio.load();
        audioStatus.textContent = `الآية ${aya.numberInSurah} من ${currentSurah.numberOfAyahs}`;
        audioProgress.value = 0;
        audioMessage.textContent = "جاري التحميل...";

        if (autoplay) {
          const startPlayback = () => {
            audio.play().catch((err) => {
              console.error(err);
              audioMessage.textContent = "تعذر التشغيل، جرّب مرة أخرى";
            });
          };

          if (audio.readyState >= 1) {
            startPlayback();
          } else {
            audio.addEventListener("loadeddata", startPlayback, { once: true });
          }
        }
      }

      function loadFullSurah(autoplay = false) {
        if (!currentSurah) return;

        const src = getFullSurahAudioUrl();
        if (!src) return;

        audio.src = src;
        audio.load();
        audioStatus.textContent = `السورة كاملة: ${currentSurah.name}`;
        audioProgress.value = 0;
        audioMessage.textContent = "جاري تحميل التلاوة الكاملة...";

        if (autoplay) {
          const startPlayback = () => {
            audio.play().catch((err) => {
              console.error(err);
              audioMessage.textContent = "تعذر تشغيل التلاوة الكاملة";
            });
          };

          if (audio.readyState >= 1) {
            startPlayback();
          } else {
            audio.addEventListener("loadeddata", startPlayback, { once: true });
          }
        }
      }

      function playCurrentSelection() {
        if (!currentSurah) return;

        if (fullSurahMode) {
          loadFullSurah(true);
          return;
        }

        loadAudioAyah(currentAyaIndex, true);
      }

      playBtn.addEventListener("click", () => {
        if (audio.paused) {
          playCurrentSelection();
        } else {
          audio.pause();
        }
      });

      prevBtn.addEventListener("click", () => {
        if (!currentSurah) return;

        if (fullSurahMode) {
          fullSurahMode = false;
          updateModeButton();
        }

        if (currentAyaIndex > 0) {
          loadAudioAyah(currentAyaIndex - 1, true);
        } else {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        }
      });

      nextBtn.addEventListener("click", () => {
        if (!currentSurah) return;

        if (fullSurahMode) {
          fullSurahMode = false;
          updateModeButton();
        }

        if (currentAyaIndex < currentSurah.ayahs.length - 1) {
          loadAudioAyah(currentAyaIndex + 1, true);
        } else {
          audio.pause();
          audio.currentTime = 0;
          audioStatus.textContent = "انتهت التلاوة ✓";
          playBtn.innerHTML = "&#9654;";
        }
      });

      modeBtn.addEventListener("click", () => {
        if (!currentSurah) return;

        fullSurahMode = !fullSurahMode;
        updateModeButton();

        if (fullSurahMode) {
          loadFullSurah(true);
        } else {
          loadAudioAyah(currentAyaIndex, true);
        }
      });

      audio.addEventListener("play", () => {
        playBtn.innerHTML = "&#10074;&#10074;";
      });

      audio.addEventListener("pause", () => {
        playBtn.innerHTML = "&#9654;";
      });

      audio.addEventListener("timeupdate", () => {
        if (
          !isDragging &&
          Number.isFinite(audio.duration) &&
          audio.duration > 0
        ) {
          audioProgress.value = (audio.currentTime / audio.duration) * 100 || 0;
        }
        audioTime.textContent =
          formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      });

      audio.addEventListener("canplay", () => {
        audioMessage.textContent = "✓ جاهز";
      });

      audio.addEventListener("ended", () => {
        if (fullSurahMode) {
          audioStatus.textContent = "انتهت التلاوة ✓";
          playBtn.innerHTML = "&#9654;";
          return;
        }

        if (currentAyaIndex < currentSurah.ayahs.length - 1) {
          loadAudioAyah(currentAyaIndex + 1, true);
        } else {
          audioStatus.textContent = "انتهت التلاوة ✓";
          playBtn.innerHTML = "&#9654;";
        }
      });

      audio.addEventListener("error", () => {
        if (fullSurahMode) {
          audioMessage.textContent =
            "تعذر تشغيل التلاوة الكاملة، تم الإرجاع إلى الآية الحالية";
          fullSurahMode = false;
          updateModeButton();
          loadAudioAyah(currentAyaIndex, true);
          return;
        }

        audioMessage.textContent = "تعذر تحميل هذه الآية، جرّب الآية التالية";
        console.error("Audio file not found:", audio.src);
      });

      audioProgress.addEventListener("mousedown", () => {
        isDragging = true;
      });

      audioProgress.addEventListener("change", () => {
        if (audio.duration) {
          audio.currentTime = (audioProgress.value / 100) * audio.duration;
        }
        isDragging = false;
      });

      function formatTime(seconds) {
        if (!Number.isFinite(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");
        return mins + ":" + secs;
      }

      function renderAyahs() {
        const container = document.getElementById("ayat-container");
        const page = document.createElement("div");
        page.className = "quran-page";

        const text = document.createElement("div");
        text.className = "aya-text";

        if (currentSurah.number !== 1 && currentSurah.number !== 9) {
          const basmala = document.createElement("span");
          basmala.className = "bismillah";
          basmala.textContent = bismillah;
          page.appendChild(basmala);
        }

        currentSurah.ayahs.forEach((aya) => {
          const ayaText = document.createTextNode(
            removeBismillah(aya.text, currentSurah.number, aya.numberInSurah),
          );
          const ayaNumber = document.createElement("span");
          ayaNumber.className = "aya-number";
          ayaNumber.textContent = aya.numberInSurah;

          text.appendChild(ayaText);
          text.appendChild(ayaNumber);
        });

        page.appendChild(text);
        container.innerHTML = "";
        container.appendChild(page);
      }

      function removeBismillah(text, suraNumber, ayaNumber) {
        if (suraNumber === 1 || suraNumber === 9 || ayaNumber !== 1) {
          return text;
        }
        const words = text.trim().split(/\s+/);
        return words.length > 4 ? words.slice(4).join(" ") : text;
      }
    </script>
  </body>
</html>
