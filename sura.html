<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" href="images/unnamed (1).webp" type="image/x-icon" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <title>&#1587;&#1608;&#1585;&#1577;</title> -->
    <title>Quran |</title>
    <style>
      body {
        background-color: #1e1f22;
        margin: auto;
        padding: 30px 20px;
        text-align: center;
        font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
        color: #fff;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: rgb(96, 165, 250);
        text-decoration: none;
        font-size: 0.9rem;
        margin-bottom: 20px;
        border: 1px solid rgba(59, 130, 246, 0.2);
        padding: 6px 14px;
        border-radius: 20px;
        background-color: #17255466;
        transition: 0.3s;
      }

      .back-btn:hover {
        background-color: rgba(59, 130, 246, 0.1);
        border-color: rgb(59, 130, 246);
      }

      .box-start {
        margin: auto;
        background-color: #14214966;
        margin-bottom: 30px;
        width: 700px;
        max-width: 100%;
        box-sizing: border-box;
        overflow: hidden;
        padding: 30px;
        position: relative;
        border-radius: 20px;
        border: 0.1px solid rgb(33, 57, 97);
      }

      .sura-name {
        font-size: 2.5rem;
        color: #fff;
        margin: 0;
      }

      .sura-info {
        color: rgb(96, 165, 250);
        font-size: 1rem;
        margin-top: 8px;
      }

      .audio-box {
        margin-top: 18px;
        padding: 18px;
        background: linear-gradient(135deg, #111827, #17255466);
        border: 1px solid rgb(31, 41, 55);
        border-radius: 18px;
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.18);
      }

      .audio-box p {
        margin: 0 0 10px;
        color: rgb(96, 165, 250);
        font-size: 0.95rem;
      }

      .audio-player {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .play-btn {
        width: 48px;
        height: 48px;
        flex: 0 0 48px;
        border: 1px solid rgba(96, 165, 250, 0.5);
        border-radius: 50%;
        color: #fff;
        background: linear-gradient(135deg, rgb(59, 130, 246), #1d4ed8);
        cursor: pointer;
        font-size: 1.2rem;
        transition: 0.25s;
      }

      .play-btn:hover {
        transform: scale(1.06);
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
      }

      .player-details {
        width: 100%;
      }

      .player-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #dbeafe;
        font-size: 0.85rem;
        margin-bottom: 8px;
      }

      .progress {
        width: 100%;
        height: 7px;
        direction: ltr;
        accent-color: rgb(96, 165, 250);
        cursor: pointer;
      }

      .audio-message {
        margin-top: 8px;
        color: #93c5fd;
        font-size: 0.8rem;
      }

      .ayat-container {
        max-width: 850px;
        margin: auto;
      }

      .quran-page {
        background-color: #151922;
        border: 1px solid rgb(31, 41, 55);
        border-radius: 14px;
        padding: 30px;
        text-align: justify;
        color: #f3f4f6;
      }

      .bismillah {
        display: block;
        text-align: center;
        color: #ffffff;
        font-size: 1.9rem;
        line-height: 2.2;
        margin-bottom: 25px;
        font-family: "Traditional Arabic", "Amiri", serif;
        font-weight: 700;
      }

      .aya-text {
        font-family: "Traditional Arabic", "Amiri", serif;
        font-size: 1.75rem;
        line-height: 2.45;
        word-spacing: 4px;
      }

      .aya-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 31px;
        height: 31px;
        margin: 0 7px;
        border-radius: 50%;
        background-color: #17255466;
        border: 1px solid rgba(59, 130, 246, 0.35);
        color: rgb(96, 165, 250);
        font-size: 0.85rem;
        font-family: ui-monospace, monospace;
        vertical-align: middle;
      }

      .loading,
      .error {
        color: rgb(96, 165, 250);
        font-size: 1.2rem;
        margin-top: 50px;
      }

      .error {
        color: #f87171;
      }

      @media (max-width: 600px) {
        body {
          padding: 22px 12px;
        }

        .box-start {
          padding: 24px 16px;
          border-radius: 16px;
        }

        .sura-name {
          font-size: 2rem;
        }

        .quran-page {
          padding: 20px 16px;
        }

        .bismillah {
          font-size: 1.55rem;
        }

        .aya-text {
          font-size: 1.45rem;
          line-height: 2.35;
          word-spacing: 2px;
        }
      }
    </style>
  </head>

  <body>
    <a href="index.html" class="back-btn"
      >&#8592; &#1575;&#1604;&#1593;&#1608;&#1583;&#1577;
      &#1604;&#1604;&#1585;&#1574;&#1610;&#1587;&#1610;&#1577;</a
    >

    <div class="box-start">
      <h1 class="sura-name" id="sura-name">
        &#1580;&#1575;&#1585;&#1610;
        &#1575;&#1604;&#1578;&#1581;&#1605;&#1610;&#1604;...
      </h1>
      <p class="sura-info" id="sura-info"></p>
      <div class="audio-box">
        <p>
          &#1578;&#1604;&#1575;&#1608;&#1577;
          &#1575;&#1604;&#1588;&#1610;&#1582; &#1593;&#1576;&#1583;
          &#1575;&#1604;&#1576;&#1575;&#1587;&#1591; &#1593;&#1576;&#1583;
          &#1575;&#1604;&#1589;&#1605;&#1583;
        </p>
        <div class="audio-player">
          <button class="play-btn" id="play-btn" type="button">&#9654;</button>
          <div class="player-details">
            <div class="player-row">
              <span id="audio-status"
                >&#1580;&#1575;&#1585;&#1610;
                &#1578;&#1580;&#1607;&#1610;&#1586;
                &#1575;&#1604;&#1578;&#1604;&#1575;&#1608;&#1577;...</span
              >
              <span id="audio-time">0:00 / 0:00</span>
            </div>
            <input
              class="progress"
              id="audio-progress"
              type="range"
              min="0"
              max="100"
              value="0"
            />
          </div>
        </div>
        <div class="audio-message" id="audio-message"></div>
        <audio
          id="quran-audio"
          preload="metadata"
          crossorigin="anonymous"
        ></audio>
      </div>
    </div>

    <div class="ayat-container" id="ayat-container">
      <p class="loading">
        &#1580;&#1575;&#1585;&#1610; &#1578;&#1581;&#1605;&#1610;&#1604;
        &#1575;&#1604;&#1587;&#1608;&#1585;&#1577;...
      </p>
    </div>

    <script>
      const id = new URLSearchParams(window.location.search).get("id") || "1";
      const bismillah =
        "\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u0651\u064e\u0647\u0650 \u0627\u0644\u0631\u0651\u064e\u062d\u0652\u0645\u064e\u0670\u0646\u0650 \u0627\u0644\u0631\u0651\u064e\u062d\u0650\u064a\u0645\u0650";
      const audio = document.getElementById("quran-audio");
      const playBtn = document.getElementById("play-btn");
      const audioStatus = document.getElementById("audio-status");
      const audioTime = document.getElementById("audio-time");
      const audioProgress = document.getElementById("audio-progress");
      const audioMessage = document.getElementById("audio-message");

      let currentSurah = null;
      let currentAyaIndex = 0;
      let isDragging = false;

      // Load Surah Data with Audio
      fetch(`https://api.alquran.cloud/v1/surah/${id}/ar.abdulbasit_mujawwad`)
        .then((r) => r.json())
        .then((data) => {
          currentSurah = data.data;
          document.title = `Quran | ${currentSurah.name}`;
          document.getElementById("sura-name").textContent = currentSurah.name;
          document.getElementById("sura-info").textContent =
            "عدد الآيات: " +
            currentSurah.numberOfAyahs +
            " | " +
            (currentSurah.revelationType === "Meccan" ? "مكية" : "مدنية");
          initAudio();
          renderAyahs();
        })
        .catch((err) => {
          console.error(err);
          // Fallback إذا فشل
          fetch(`https://api.alquran.cloud/v1/surah/${id}`)
            .then((r) => r.json())
            .then((d) => {
              currentSurah = d.data;
              initAudio();
              renderAyahs();
            });
        });

      function getAudioUrl(ayahIndex) {
        if (!currentSurah || !currentSurah.ayahs[ayahIndex]) return "";

        const ayahNumber = currentSurah.ayahs[ayahIndex].number;

        return `https://cdn.islamic.network/quran/audio/192/ar.abdulbasitmujawwad/${ayahNumber}.mp3`;
      }
      function initAudio() {
        if (!currentSurah) return;
        audioStatus.textContent = "جاهز ✓";
        audioProgress.value = 0;
        loadAudioAyah(0);
      }

      function loadAudioAyah(index) {
        if (!currentSurah || index >= currentSurah.ayahs.length) return;

        currentAyaIndex = index;
        const aya = currentSurah.ayahs[index];
        const ayahInSurah = aya.numberInSurah;

        const audioSrc = getAudioUrl(index);

        audio.src = audioSrc;
        audioStatus.textContent = `الآية ${ayahInSurah} من ${currentSurah.numberOfAyahs}`;
        audioProgress.value = 0;
        audioMessage.textContent = "جاري التحميل...";
      }

      playBtn.addEventListener("click", () => {
        if (!audio.src) return;
        if (audio.paused) {
          audio.play().catch((err) => {
            console.error(err);
            audioMessage.textContent = "خطأ في التشغيل";
          });
        } else {
          audio.pause();
        }
      });

      audio.addEventListener("play", () => {
        playBtn.innerHTML = "&#10074;&#10074;";
      });

      audio.addEventListener("pause", () => {
        playBtn.innerHTML = "&#9654;";
      });

      audio.addEventListener("timeupdate", () => {
        if (!isDragging) {
          audioProgress.value = (audio.currentTime / audio.duration) * 100 || 0;
        }
        audioTime.textContent =
          formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      });

      audio.addEventListener("canplay", () => {
        audioMessage.textContent = "✓ جاهز";
      });

      audio.addEventListener("ended", () => {
        if (currentAyaIndex < currentSurah.ayahs.length - 1) {
          loadAudioAyah(currentAyaIndex + 1);
          audio.play();
        } else {
          audioStatus.textContent = "انتهت التلاوة ✓";
          playBtn.innerHTML = "&#9654;";
        }
      });

      audio.addEventListener("error", (e) => {
        // شيل الحلقة اللانهائية! فقط أخبر المستخدم
        audioMessage.textContent =
          "⚠️ لم يتم تحميل الملف - تأكد من وجود مجلد audio/";
        console.error(
          "Audio file not found:",
          currentSurah.ayahs[currentAyaIndex].number,
        );
      });

      audioProgress.addEventListener("mousedown", () => {
        isDragging = true;
      });

      audioProgress.addEventListener("change", () => {
        if (audio.duration) {
          audio.currentTime = (audioProgress.value / 100) * audio.duration;
        }
        isDragging = false;
      });

      function formatTime(seconds) {
        if (!Number.isFinite(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");
        return mins + ":" + secs;
      }

      function renderAyahs() {
        const container = document.getElementById("ayat-container");
        const page = document.createElement("div");
        page.className = "quran-page";

        const text = document.createElement("div");
        text.className = "aya-text";

        if (currentSurah.number !== 1 && currentSurah.number !== 9) {
          const basmala = document.createElement("span");
          basmala.className = "bismillah";
          basmala.textContent = bismillah;
          page.appendChild(basmala);
        }

        currentSurah.ayahs.forEach((aya) => {
          const ayaText = document.createTextNode(
            removeBismillah(aya.text, currentSurah.number, aya.numberInSurah),
          );
          const ayaNumber = document.createElement("span");
          ayaNumber.className = "aya-number";
          ayaNumber.textContent = aya.numberInSurah;

          text.appendChild(ayaText);
          text.appendChild(ayaNumber);
        });

        page.appendChild(text);
        container.innerHTML = "";
        container.appendChild(page);
      }

      function removeBismillah(text, suraNumber, ayaNumber) {
        if (suraNumber === 1 || suraNumber === 9 || ayaNumber !== 1) {
          return text;
        }
        const words = text.trim().split(/\s+/);
        return words.length > 4 ? words.slice(4).join(" ") : text;
      }
    </script>
  </body>
</html>
